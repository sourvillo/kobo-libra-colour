    Ivan - connectWireless always silent: no
    FeatureSettings - BookSpecificStats: yes
    # event0 не эксклюзивно → мой btnwatch читает физкнопки (выход из браузера)
    Don't grab exclusive access to event0: yes
    # ── Браузер без Wi-Fi (оффлайн-статистика через 127.0.0.1) ──
    Ivan - browser opens without WiFi: no
    Ivan - browser opens without WiFi (notConnected): yes
