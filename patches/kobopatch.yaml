    Ivan - blank stats SmartLink on home: yes
    # Вкладки/ссылки в браузере: тап теперь доходит до реального клика WebKit
    Ivan - browser taps deliver clicks: yes
    # Убрать вторую штатную плитку статистики «Your reading life / ACTIVITY»
    Ivan - hide 2nd home stats tile (Your reading life): yes
    # ЭКСПЕРИМЕНТ откатываю: сжимал обложки (виджет делит ширину на число книг), крупных+скролла нет
